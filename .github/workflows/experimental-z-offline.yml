name: GROWBOT experimental Z offline checks

on:
  push:
    branches: [feature/optris-auto-z-standoff, feature/v6-demo-hardening]
  pull_request:

jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install minimal dependencies for hardware-free tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy==1.26.4 pandas==2.1.4 opencv-python-headless==4.9.0.80
      - name: Compile application and helper source
        run: |
          python -m compileall -q growbot_gantry_realsense_optris_v6.py growbot_optris_auto_z.py growbot_pointcloud_v5.py growbot_segmentation_v5.py growbot_mapping_v5.py growbot_display_v6.py
      - name: Run tests without opening any cameras or serial ports
        run: python -m unittest discover -s tests -v
